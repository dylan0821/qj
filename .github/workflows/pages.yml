name: Publish frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public frontend only
        run: |
          mkdir _site
          cp index.html app.js reader-data.js auth.js site-config.js theme.js math-config.js style.css logo-favicon.png logo-flat-skeuo.png .nojekyll _site/
          cp -R vendor _site/vendor
          test ! -e _site/data
          test ! -e _site/private-assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
